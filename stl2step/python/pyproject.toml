[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stl2step"
version = "1.0.0"
description = "STL -> STEP (faces planes et cylindriques), sections DXF, coupe de maillage"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
gui = ["matplotlib>=3.5"]
test = ["pytest"]

[project.scripts]
stl2step = "stl2step.cli:main"

[tool.setuptools]
packages = ["stl2step"]
