<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c2733">
<title>SVG2Print</title>
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18h18v3H3z" fill="currentColor" opacity=".45"/><path d="M6 14c2-6 5-9 6-9s4 3 6 9h-3c-1-3-2-5-3-5s-2 2-3 5z" fill="currentColor"/></svg>SVG2Print</div>
  <div class="printer-pill" id="pill">—</div>
</header>

<main class="layout">
  <section class="stage">
    <div class="stage-tools">
      <div class="seg" role="tablist" aria-label="Vue">
        <button data-view="model" class="on">Pièce</button>
        <button data-view="layers" id="viewLayersBtn" disabled>Couches</button>
      </div>
      <button class="ghost small" id="zoomBtn">Plateau entier</button>
    </div>
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="view"></canvas>
      <div class="empty" id="emptyHint">
        <p>Ouvrez un fichier SVG pour le placer sur le plateau.</p>
        <button class="primary" id="openBtn2">Ouvrir un SVG</button>
      </div>
    </div>
    <div class="layer-bar" id="layerBar" hidden>
      <input type="range" id="layerSlider" min="0" max="0" value="0" aria-label="Couche affichée">
      <span id="layerLabel" class="tab">—</span>
    </div>
    <dl class="stats" id="stats" hidden>
      <div><dt>Dimensions</dt><dd id="stDim">—</dd></div>
      <div><dt>Couches</dt><dd id="stLayers">—</dd></div>
      <div><dt>Durée</dt><dd id="stTime">—</dd></div>
      <div><dt>Filament</dt><dd id="stFil">—</dd></div>
    </dl>
  </section>

  <aside class="controls">
    <!-- 1. Fichier -->
    <section class="step">
      <h2><span class="n">1</span>Fichier</h2>
      <input type="file" id="fileInput" accept=".svg,image/svg+xml" hidden>
      <div class="row">
        <button class="primary" id="openBtn">Ouvrir un SVG</button>
        <span class="file-name" id="fileName">Aucun fichier</span>
      </div>
      <label class="field">Lecture du dessin
        <select data-g="xf" data-k="mode">
          <option value="auto">Automatique (remplissages + traits)</option>
          <option value="stroke">Parcours uniquement (traits)</option>
          <option value="fill">Formes pleines uniquement</option>
        </select>
      </label>
      <div class="grid2">
        <label class="field">Largeur des traits (mm)
          <input type="number" step="0.1" min="0" data-g="xf" data-k="strokeWidth">
          <small>0 = largeur du SVG</small>
        </label>
        <label class="check"><input type="checkbox" data-g="xf" data-k="whiteIsEmpty"> Le blanc est du vide</label>
      </div>
      <ul class="warn" id="warnings"></ul>
    </section>

    <!-- 2. Imprimante -->
    <section class="step">
      <h2><span class="n">2</span>Imprimante</h2>
      <div class="seg wide" id="printerSeg">
        <button data-printer="cc">Elegoo Centauri Carbon</button>
        <button data-printer="k1">Creality K1 / K1C</button>
      </div>
      <div class="grid2">
        <label class="field">Adresse IP
          <input type="text" inputmode="decimal" placeholder="192.168.1.50" data-g="net" data-k="host" autocomplete="off">
        </label>
        <label class="field" id="portField">Port Moonraker
          <input type="number" placeholder="auto (7125)" data-g="net" data-k="port">
        </label>
        <label class="field" id="mbField">Identifiant carte mère
          <input type="text" placeholder="auto" data-g="net" data-k="mainboardId" autocomplete="off">
        </label>
      </div>
      <div class="row">
        <button class="ghost" id="testBtn">Tester la connexion</button>
        <button class="ghost" id="discoverBtn" hidden>Rechercher</button>
        <span class="conn" id="connState"></span>
      </div>
    </section>

    <!-- 3. Motif -->
    <section class="step">
      <h2><span class="n">3</span>Motif</h2>
      <div class="seg wide" id="polaritySeg">
        <button data-pol="positive"><b>Positif</b><small>motif en relief</small></button>
        <button data-pol="negative"><b>Négatif</b><small>motif en creux</small></button>
      </div>
      <div class="grid3">
        <label class="field">Largeur (mm)<input type="number" step="0.1" min="1" id="wInput"></label>
        <button class="lock on" id="lockBtn" title="Conserver les proportions" aria-pressed="true">⛓</button>
        <label class="field">Hauteur (mm)<input type="number" step="0.1" min="1" id="hInput"></label>
      </div>
      <div class="grid2">
        <label class="field">Échelle (%)<input type="number" step="1" min="1" id="pctInput"></label>
        <label class="field">Rotation (°)<input type="number" step="1" data-g="xf" data-k="rotation"></label>
      </div>
      <div class="row tools">
        <button class="ghost" id="mirrorX" aria-pressed="false">Miroir ↔</button>
        <button class="ghost" id="mirrorY" aria-pressed="false">Miroir ↕</button>
        <button class="ghost" id="rot90">Pivoter 90°</button>
        <button class="ghost" id="fitBtn">Agrandir au plateau</button>
        <button class="ghost" id="origBtn">Taille d'origine</button>
      </div>
      <div class="grid2">
        <label class="field">Épaisseur plaque (mm)<input type="number" step="0.2" min="0" data-g="part" data-k="plateThickness"><small>0 = motif seul / pochoir</small></label>
        <label class="field">Hauteur du motif (mm)<input type="number" step="0.1" min="0.2" max="1" inputmode="decimal" data-g="part" data-k="reliefHeight" id="reliefInput"><small>De 0,2 à 1 mm</small></label>
        <div class="chips" id="reliefChips" role="group" aria-label="Hauteur du motif">
          <button type="button" data-relief="0.2">0,2</button>
          <button type="button" data-relief="0.4">0,4</button>
          <button type="button" data-relief="0.6">0,6</button>
          <button type="button" data-relief="0.8">0,8</button>
          <button type="button" data-relief="1">1 mm</button>
        </div>
        <label class="field">Forme de plaque
          <select data-g="part" data-k="plateShape">
            <option value="rect">Rectangle</option>
            <option value="contour">Suit le contour</option>
            <option value="ellipse">Ovale</option>
          </select>
        </label>
        <label class="field">Marge autour (mm)<input type="number" step="0.5" min="0" data-g="part" data-k="plateMargin"></label>
        <label class="field">Rayon des coins (mm)<input type="number" step="0.5" min="0" data-g="part" data-k="plateRadius"></label>
      </div>
    </section>

    <!-- 4. Filament -->
    <section class="step">
      <h2><span class="n">4</span>Filament</h2>
      <p class="hint" id="filHint"></p>
      <details>
        <summary>Modifier les réglages filament</summary>
        <div class="grid2">
          <label class="field">Buse (°C)<input type="number" data-g="fil" data-k="nozzle"></label>
          <label class="field">Buse 1re couche (°C)<input type="number" data-g="fil" data-k="nozzleFirst"></label>
          <label class="field">Plateau (°C)<input type="number" data-g="fil" data-k="bed"></label>
          <label class="field">Plateau 1re couche (°C)<input type="number" data-g="fil" data-k="bedFirst"></label>
          <label class="field">Ventilateur (%)<input type="number" min="0" max="100" data-g="fil" data-k="fan"></label>
          <label class="field">Couches sans ventilation<input type="number" min="0" data-g="fil" data-k="fanFirstLayers"></label>
          <label class="field">Débit (ratio)<input type="number" step="0.01" data-g="fil" data-k="flow"></label>
          <label class="field">Débit volumique max (mm³/s)<input type="number" step="0.5" data-g="fil" data-k="maxVolumetric"></label>
          <label class="field">Avance de pression<input type="number" step="0.005" data-g="fil" data-k="pressureAdvance"><small>0 = valeur de l'imprimante</small></label>
          <label class="field">Rétraction (mm)<input type="number" step="0.1" data-g="fil" data-k="retractLength"></label>
          <label class="field">Vitesse rétraction (mm/s)<input type="number" data-g="fil" data-k="retractSpeed"></label>
          <label class="field">Levée Z (mm)<input type="number" step="0.1" data-g="fil" data-k="zHop"></label>
        </div>
        <button class="ghost" id="resetFil">Rétablir le réglage optimisé</button>
      </details>
      <details>
        <summary>Réglages d'impression avancés</summary>
        <div class="grid2">
          <label class="field">Hauteur de couche (mm)<input type="number" step="0.04" min="0.08" max="0.32" data-g="print" data-k="layerHeight"></label>
          <label class="field">1re couche (mm)<input type="number" step="0.04" min="0.12" max="0.32" data-g="print" data-k="firstLayerHeight"></label>
          <label class="field">Largeur d'extrusion (mm)<input type="number" step="0.01" min="0.3" max="0.7" data-g="print" data-k="lineWidth"></label>
          <label class="field">Nombre de parois<input type="number" min="1" max="6" data-g="print" data-k="walls"></label>
          <label class="field">Recouvrement remplissage (%)<input type="number" min="0" max="40" data-g="print" data-k="infillOverlap"></label>
          <label class="field">Vitesse 1re couche (mm/s)<input type="number" data-g="print" data-k="firstLayer"></label>
          <label class="field">Paroi externe (mm/s)<input type="number" data-g="print" data-k="outerWall"></label>
          <label class="field">Parois internes (mm/s)<input type="number" data-g="print" data-k="innerWall"></label>
          <label class="field">Remplissage (mm/s)<input type="number" data-g="print" data-k="infill"></label>
          <label class="field">Déplacements (mm/s)<input type="number" data-g="print" data-k="travel"></label>
          <label class="field">Accélération (mm/s²)<input type="number" data-g="print" data-k="accel"></label>
          <label class="field">Accél. 1re couche (mm/s²)<input type="number" data-g="print" data-k="accelFirst"></label>
        </div>
        <button class="ghost" id="resetPrint">Rétablir les valeurs de l'imprimante</button>
      </details>
    </section>

    <!-- 5. Imprimer -->
    <section class="step">
      <h2><span class="n">5</span>Trancher et imprimer</h2>
      <div class="row">
        <button class="primary" id="sliceBtn" disabled>Trancher</button>
        <button class="ghost" id="saveBtn" disabled>Enregistrer le G-code</button>
      </div>
      <div class="progress" id="progress" hidden><span></span></div>
      <label class="check"><input type="checkbox" id="startChk" checked> Lancer l'impression après l'envoi</label>
      <label class="check" id="levelRow"><input type="checkbox" id="levelChk" checked> Nivellement automatique avant impression</label>
      <button class="send" id="sendBtn" disabled>Envoyer à l'imprimante</button>
      <ol class="log" id="log"></ol>
    </section>
  </aside>
</main>
<script src="app.js"></script>
</body>
</html>
