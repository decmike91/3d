name: STL2STEP — appli Android et appli Python

on:
  push:
    paths: ['stl2step/**', '.github/workflows/stl2step.yml']
  pull_request:
    paths: ['stl2step/**', '.github/workflows/stl2step.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    defaults: { run: { working-directory: stl2step } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Dépendances Python (OpenCascade sert à valider les STEP produits)
        run: pip install --quiet numpy pytest cadquery-ocp
      - name: Tests de l'appli Python
        working-directory: stl2step/python
        run: python -m pytest -q tests
      - name: Cœur Java de l'appli Android (sans Android)
        working-directory: stl2step/android
        run: |
          mkdir -p /tmp/core /tmp/step
          javac -d /tmp/core app/src/main/java/fr/stl2step/core/*.java coretest/CoreSelfTest.java
          java -cp /tmp/core CoreSelfTest ../samples /tmp/step
      - name: Validation OpenCascade des STEP produits par le cœur Java
        run: python python/tests/check_step.py /tmp/step/*.step
      - name: Compiler l'APK
        working-directory: stl2step/android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Préparer les fichiers
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk STL2STEP-android.apk
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --print-certs STL2STEP-android.apk | head -3
          (cd python && zip -qr ../STL2STEP-python.zip stl2step pyproject.toml tests -x '*__pycache__*') && zip -qj STL2STEP-python.zip README.md
          zip -qr STL2STEP-python.zip samples
          ls -la STL2STEP-*
      - uses: actions/upload-artifact@v4
        with:
          name: STL2STEP
          path: |
            stl2step/STL2STEP-android.apk
            stl2step/STL2STEP-python.zip
      - name: Publier (release stl2step)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: stl2step
          name: STL2STEP — dernière version
          prerelease: true
          make_latest: false
          body: |
            Compilée automatiquement depuis la branche main (${{ github.sha }}).
            - **Android** : installer `STL2STEP-android.apk` (autoriser l'installation d'applications inconnues). Aucune permission, fonctionne sans connexion.
            - **Python** (Windows, macOS, Linux) : `STL2STEP-python.zip`, voir le README à l'intérieur.
          files: |
            stl2step/STL2STEP-android.apk
            stl2step/STL2STEP-python.zip
