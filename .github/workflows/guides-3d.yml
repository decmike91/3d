name: Guides 3D — lecture HTML et appli Android

on:
  push:
    branches: [main]
    paths: ['guides-3d/**', '.github/workflows/guides-3d.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    defaults: { run: { working-directory: guides-3d } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Construire le site HTML (web/)
        run: node build.mjs
      - name: Fichier HTML unique (images incluses)
        run: pip install --quiet pillow && python tools/single.py web/index.html Guides3D.html
      - name: Compiler l'APK
        working-directory: guides-3d/android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Préparer les fichiers
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Guides3D-android.apk
          (cd web && zip -qr ../Guides3D-site.zip .)
          ls -la Guides3D*
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --print-certs Guides3D-android.apk | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: Guides3D
          path: |
            guides-3d/Guides3D-android.apk
            guides-3d/Guides3D.html
            guides-3d/Guides3D-site.zip
      # Page « Releases » : téléchargement direct depuis le téléphone
      - name: Publier (release guides-3d)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: guides-3d
          name: Guides 3D (Creality Print, FreeCAD, impression 3D) — dernière version
          prerelease: true
          make_latest: false
          body: |
            Compilée automatiquement depuis la branche main (${{ github.sha }}).
            - **Android** : installer `Guides3D-android.apk` (autoriser l'installation d'applications inconnues). Fonctionne sans connexion.
            - **HTML** : `Guides3D.html` s'ouvre directement dans un navigateur (un seul fichier, images incluses, environ 55 Mo).
            - **Site** : `Guides3D-site.zip` contient la version installable (PWA) à héberger, par exemple sur GitHub Pages.
          files: |
            guides-3d/Guides3D-android.apk
            guides-3d/Guides3D.html
            guides-3d/Guides3D-site.zip
