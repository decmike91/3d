name: Build SVG2Print (Android + Windows)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm test
      - run: npm run android:sync
      - name: Compiler l'APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - run: |
          cp android/app/build/outputs/apk/release/app-release.apk SVG2Print-android.apk
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --print-certs SVG2Print-android.apk | head -3
      - uses: actions/upload-artifact@v4
        with: { name: SVG2Print-android, path: SVG2Print-android.apk }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Compiler l'installateur Windows
        shell: bash
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
        run: |
          set -o pipefail
          npm run dist:win 2>&1 | tee build-win.log || {
            grep -v '^\s*$' build-win.log | tail -25 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with: { name: SVG2Print-windows, path: 'dist/*.exe' }

  # Publie l'APK et l'exe dans la page "Releases" (téléchargeables directement depuis le téléphone)
  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Dernière version (branche main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SVG2Print — dernière version
          prerelease: true
          make_latest: false
          body: "Compilée automatiquement depuis la branche main (${{ github.sha }}). Android : installer SVG2Print-android.apk. Windows : SVG2Print-Setup (installateur) ou SVG2Print-Portable."
          files: 'out/*'
      - name: Version publiée (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: 'out/*' }
